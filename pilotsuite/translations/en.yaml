configuration:
  log_level:
    name: Log level
    description: Runtime log verbosity. Credentials are always redacted.
  golden_zone_area_ids:
    name: Initial areas (first setup only)
    description: Used only on the first start. Manage existing Habitus zones in PilotSuite; this option does not modify them.
  refresh_interval_seconds:
    name: Refresh interval
    description: Seconds between full Home Assistant snapshot reconciliations.
  audit_retention:
    name: Audit retention
    description: Maximum number of PilotSuite audit events retained.

