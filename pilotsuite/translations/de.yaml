configuration:
  log_level:
    name: Protokollstufe
    description: Detailgrad der Laufzeitprotokolle. Zugangsdaten werden immer entfernt.
  golden_zone_area_ids:
    name: Startbereiche (nur Ersteinrichtung)
    description: Nur beim allerersten Start verwendet. Bestehende Habitus-Zonen verwaltest du in PilotSuite; diese Option ändert sie nicht.
  refresh_interval_seconds:
    name: Aktualisierungsintervall
    description: Sekunden zwischen vollständigen Abgleichen mit Home Assistant.
  audit_retention:
    name: Audit-Aufbewahrung
    description: Maximale Anzahl gespeicherter PilotSuite-Auditereignisse.

