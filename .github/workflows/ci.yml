name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pilotsuite/requirements.txt
      - name: Validate repository contracts
        run: python scripts/validate.py
      - name: Validate versioned release source
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          PUBLISHED_SHA="$(python -c 'import json; d=json.load(open("docs/RELEASE_STATE.json")); print(d.get("published_source", d["release"])["commit"])')"
          python scripts/release_preflight.py --candidate "$CANDIDATE_SHA" --published "$PUBLISHED_SHA" --allow-unchanged
      - name: Check frontend syntax and selection model
        run: |
          node --check pilotsuite/pilotsuite/web/app.js
          node --check pilotsuite/pilotsuite/web/history.js
          node --check pilotsuite/pilotsuite/web/drafts.js
          node --check pilotsuite/pilotsuite/web/review_notes.js
          node --check pilotsuite/pilotsuite/web/review_compass.js
          node --check pilotsuite/pilotsuite/web/selections.js
          node --test pilotsuite/tests/*.test.cjs
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check --requirement pilotsuite/requirements.txt
      - name: Compile Python
        run: python -m compileall -q pilotsuite/pilotsuite
      - name: Run unit tests
        env:
          PYTHONPATH: pilotsuite
        run: python -m unittest discover -s pilotsuite/tests -v

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build amd64 test image
        uses: docker/build-push-action@v6
        with:
          context: pilotsuite
          platforms: linux/amd64
          push: false
          tags: pilotsuite:ci
          build-args: |
            BUILD_ARCH=amd64

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python for isolated full-app browser fixture
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install existing runtime dependencies for synthetic fixture
        run: python -m pip install --disable-pip-version-check --requirement pilotsuite/requirements.txt
      - name: Install pinned browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise entity selection UI
        env:
          PILOTSUITE_SCREENSHOTS: ui-review
        run: node scripts/test_selection_browser.cjs
      - name: Exercise review-note editor
        env:
          PILOTSUITE_SCREENSHOTS: ui-review
        run: node scripts/test_review_notes_browser.cjs
      - name: Exercise review compass against the isolated actual application
        env:
          PILOTSUITE_SCREENSHOTS: ui-review
        run: node scripts/test_review_compass_browser.cjs
      - name: Exercise daily brief against the isolated actual application
        env:
          PILOTSUITE_SCREENSHOTS: ui-review
        run: node scripts/test_daily_brief_browser.cjs
      - name: Save synthetic UI review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: usability-review
          path: ui-review/*.png
          retention-days: 7

  source:
    name: Reproducible source checkout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact CI source without stored credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Bundle tracked source history and identity
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir source-evidence
          git bundle create source-evidence/pilotsuite-source.bundle HEAD
          git bundle verify source-evidence/pilotsuite-source.bundle
          printf 'checkout=%s\ntree=%s\ncandidate=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$CANDIDATE_SHA" > source-evidence/IDENTITY.txt
          (cd source-evidence && sha256sum pilotsuite-source.bundle > SHA256SUMS)
      - name: Retain source-only evidence for offline reproduction
        uses: actions/upload-artifact@v4
        with:
          name: source-checkout
          path: source-evidence/*
          retention-days: 1
          if-no-files-found: error
