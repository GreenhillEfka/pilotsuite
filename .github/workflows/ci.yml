name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pilotsuite/requirements.txt
      - name: Validate repository contracts
        run: python scripts/validate.py
      - name: Check frontend syntax and selection model
        run: |
          node --check pilotsuite/pilotsuite/web/app.js
          node --check pilotsuite/pilotsuite/web/history.js
          node --check pilotsuite/pilotsuite/web/selections.js
          node --test pilotsuite/tests/selection_draft.test.cjs
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check --requirement pilotsuite/requirements.txt
      - name: Compile Python
        run: python -m compileall -q pilotsuite/pilotsuite
      - name: Run unit tests
        env:
          PYTHONPATH: pilotsuite
        run: python -m unittest discover -s pilotsuite/tests -v

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build amd64 test image
        uses: docker/build-push-action@v6
        with:
          context: pilotsuite
          platforms: linux/amd64
          push: false
          tags: pilotsuite:ci
          build-args: |
            BUILD_ARCH=amd64

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise entity selection UI
        run: node scripts/test_selection_browser.cjs
